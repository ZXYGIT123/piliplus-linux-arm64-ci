name: Build PiliPlus Linux arm64 deb (bundled CJK font fix)

# 修复 Flutter < 3.50 的 ARM64 Linux 引擎缺少 Fontconfig 导致的中文 tofu：
#   1. 随应用内嵌 Noto Sans SC（OFL 许可），经 pubspec 注册为 PiliPlusCJK 字体族
#   2. 把 FontUtils.fontFamily 的默认值指向该字体族，使全部主题文字不再依赖系统字体回退
# 其余流程与 build-arm64.yml 相同（Flutter 源码原生 arm64 引导 + 上游编译/打包脚本）。

on:
  workflow_dispatch:
    inputs:
      pili_ref:
        description: "PiliPlus tag to build"
        required: false
        default: "2.1.6.2"
      flutter_version:
        description: "Flutter version to bootstrap (native arm64 from source)"
        required: false
        default: "3.47.7"
      version_suffix:
        description: "Appended to the Debian version (e.g. .1)"
        required: false
        default: ".1"

jobs:
  build-arm64-deb:
    name: PiliPlus Linux arm64 (.deb, CJK font bundled)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180
    steps:
      - name: Environment info
        run: |
          echo "uname: $(uname -a)"
          echo "dpkg arch: $(dpkg --print-architecture)"
          nproc
          free -h
          df -h / | tail -1

      - name: Install system dependencies (arm64)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git curl ca-certificates unzip xz-utils zip file \
            cmake ninja-build pkg-config clang lld build-essential \
            libgtk-3-dev libayatana-appindicator3-dev \
            libwebkit2gtk-4.1-dev libasound2-dev libmpv-dev \
            libjsoncpp-dev libsecret-1-dev liblzma-dev libnotify-dev \
            dbus-x11 xvfb imagemagick fonts-noto-cjk

      - name: Bootstrap Flutter (native arm64, from source)
        env:
          FLUTTER_SUPPRESS_ANALYTICS: "true"
        run: |
          set -x
          git clone --depth 1 --branch "${{ inputs.flutter_version }}" \
            https://github.com/flutter/flutter.git "$HOME/flutter"
          git config --global --add safe.directory "$HOME/flutter"
          git config --global user.name "ci"
          git config --global user.email "ci@example.com"
          export PATH="$HOME/flutter/bin:$PATH"
          echo "FLUTTER_ROOT=$HOME/flutter" >> "$GITHUB_ENV"
          echo "$HOME/flutter/bin" >> "$GITHUB_PATH"
          flutter --version
          flutter config --enable-linux-desktop
          flutter precache --linux
          dart --version

      - name: Clone PiliPlus source at tag
        run: |
          set -x
          git clone https://github.com/bggRGjQaUbCoE/PiliPlus.git .
          git checkout "${{ inputs.pili_ref }}"
          git log -1 --format='%H %d %s'
          echo "commit count: $(git rev-list --count HEAD)"

      - name: Bundle CJK font and patch default font family
        run: |
          set -eux
          mkdir -p assets/fonts
          URL1="https://raw.githubusercontent.com/google/fonts/main/ofl/notosanssc/NotoSansSC%5Bwght%5D.ttf"
          URL2="https://cdn.jsdelivr.net/gh/google/fonts@main/ofl/notosanssc/NotoSansSC%5Bwght%5D.ttf"
          curl -fsSL --retry 3 -o assets/fonts/NotoSansSC.ttf "$URL1" \
            || curl -fsSL --retry 3 -o assets/fonts/NotoSansSC.ttf "$URL2"
          curl -fsSL --retry 3 -o assets/fonts/NotoSansSC-OFL.txt \
            "https://raw.githubusercontent.com/google/fonts/main/ofl/notosanssc/OFL.txt" || true
          test "$(stat -c%s assets/fonts/NotoSansSC.ttf)" -gt 5000000
          ls -la assets/fonts/

          # 1) 在 pubspec 的 fonts 段追加内嵌中文字体
          sed -i 's|^        - asset: assets/fonts/custom_icon.ttf$|        - asset: assets/fonts/custom_icon.ttf\n    - family: PiliPlusCJK\n      fonts:\n        - asset: assets/fonts/NotoSansSC.ttf|' pubspec.yaml

          # 2) 默认字体族指向内嵌字体（未选择自定义字体时）
          sed -i "s|^  static String? get fontFamily => _appFont.fontFamily;$|  static const String defaultCjkFontFamily = 'PiliPlusCJK';\n  static String? get fontFamily => _appFont.fontFamily ?? defaultCjkFontFamily;|" lib/utils/font_utils.dart

          grep -n -A3 "PiliPlusCJK" pubspec.yaml
          grep -n "PiliPlusCJK\|defaultCjkFontFamily" lib/utils/font_utils.dart

      - name: Version + framework patches (upstream scripts)
        run: |
          set -x
          pwsh -File lib/scripts/build.ps1
          pwsh -File lib/scripts/patch.ps1 Linux
          cat pili_release.json
          grep -n '^version:' pubspec.yaml
          echo "version=${version}"

      - name: Build Linux release (linux-arm64 native)
        run: |
          set -x
          flutter build linux --release \
            --dart-define-from-file=pili_release.json --no-pub
          echo "--- bundle ---"
          ls -la build/linux/arm64/release/bundle
          ls -la build/linux/arm64/release/bundle/data/flutter_assets/fonts 2>/dev/null || true
          grep -o "PiliPlusCJK" build/linux/arm64/release/bundle/data/flutter_assets/FontManifest.json || true
          file build/linux/arm64/release/bundle/piliplus
          file build/linux/arm64/release/bundle/lib/*.so

      - name: Package .deb for arm64
        run: |
          set -eux
          VERSION="${version}${{ inputs.version_suffix }}"
          ARCH=arm64
          PKG="PiliPlus_linux_${VERSION}_${ARCH}"
          rm -rf "$PKG"
          mkdir -p "$PKG/opt/PiliPlus" \
                   "$PKG/usr/share/applications" \
                   "$PKG/usr/share/icons/hicolor/512x512/apps" \
                   "$PKG/usr/share/doc/PiliPlus"

          cp -r build/linux/arm64/release/bundle/. "$PKG/opt/PiliPlus/"
          cp -r assets/linux/DEBIAN "$PKG/DEBIAN"
          cp assets/linux/com.example.piliplus.desktop "$PKG/usr/share/applications/"
          cp assets/images/logo/logo.png "$PKG/usr/share/icons/hicolor/512x512/apps/piliplus.png"
          cp assets/fonts/NotoSansSC-OFL.txt "$PKG/usr/share/doc/PiliPlus/OFL-NotoSansSC.txt" || true

          sed -i "s|^Version: .*|Version: ${VERSION}|" "$PKG/DEBIAN/control"
          sed -i "s|^Architecture: .*|Architecture: ${ARCH}|" "$PKG/DEBIAN/control"
          sed -i "s|^Depends: libgtk-3-0t64,|Depends: libgtk-3-0t64,\n         libwebkit2gtk-4.1-0,|" "$PKG/DEBIAN/control"
          SIZE_KB=$(du -s -B1 --apparent-size "$PKG" | awk '{print $1}')
          SIZE_DEBIAN=$(du -s -B1 --apparent-size "$PKG/DEBIAN" | awk '{print $1}')
          SIZE_KB=$(( (SIZE_KB - SIZE_DEBIAN + 1023) / 1024 ))
          sed -i "s|^Installed-Size: .*|Installed-Size: ${SIZE_KB}|" "$PKG/DEBIAN/control"

          (
            cd "$PKG"
            md5sum opt/PiliPlus/piliplus opt/PiliPlus/lib/* opt/PiliPlus/data/icudtl.dat > DEBIAN/md5sums
          )
          chmod 0644 "$PKG/DEBIAN/control" "$PKG/DEBIAN/md5sums"
          chmod 0755 "$PKG/DEBIAN/postinst" "$PKG/DEBIAN/postrm" "$PKG/DEBIAN/prerm"

          cat "$PKG/DEBIAN/control"
          dpkg-deb --build --root-owner-group -Zzstd "$PKG"
          DEB="${PKG}.deb"
          ls -la "$DEB"
          dpkg-deb --info "$DEB"
          dpkg-deb -f "$DEB" Architecture Version Package Depends
          ls -la "$PKG/opt/PiliPlus/data/flutter_assets/assets/fonts/"
          echo "DEB_PATH=$PWD/$DEB" >> "$GITHUB_ENV"
          echo "DEB_NAME=$DEB" >> "$GITHUB_ENV"

      - name: Install deb and capture screenshot (CJK render check)
        continue-on-error: true
        run: |
          set -x
          sudo apt-get install -y "./${DEB_NAME}"
          dpkg -s piliplus | head -8
          echo "--- CJK fonts present on system ---"
          fc-list :lang=zh | head -3 || true
          export XDG_RUNTIME_DIR=/tmp/xdg-runtime
          mkdir -p "$XDG_RUNTIME_DIR"
          xvfb-run -a -s "-screen 0 1440x2560x24" bash -c '
            piliplus > /tmp/app.log 2>&1 &
            APP=$!
            sleep 20
            import -window root /tmp/piliplus-home.png || true
            kill $APP 2>/dev/null || true
          ' || true
          ls -la /tmp/piliplus-home.png || true
          head -40 /tmp/app.log || true

      - name: Upload deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: piliplus-linux-arm64-deb-cjk
          path: ${{ env.DEB_NAME }}
          if-no-files-found: error
          retention-days: 7

      - name: Upload screenshot artifact
        uses: actions/upload-artifact@v4
        with:
          name: piliplus-linux-arm64-screenshot
          path: /tmp/piliplus-home.png
          if-no-files-found: warn
          retention-days: 7
