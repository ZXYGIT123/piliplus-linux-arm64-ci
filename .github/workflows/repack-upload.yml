name: Repack deb and upload

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  repack-upload:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - name: Download built deb
        uses: actions/download-artifact@v4
        with:
          name: piliplus-linux-arm64-deb
          run-id: 40083156574
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Repack with fixed Depends
        run: |
          set -eux
          DEB="PiliPlus_linux_2.1.6+5472_arm64.deb"
          PKG="PiliPlus_linux_2.1.6+5472_arm64"
          mv "$DEB" original.deb
          rm -rf "$PKG"
          dpkg-deb -R original.deb "$PKG"
          sed -i 's|^Depends: libgtk-3-0t64,|Depends: libgtk-3-0t64,\n         libwebkit2gtk-4.1-0,|' "$PKG/DEBIAN/control"
          cat "$PKG/DEBIAN/control"
          dpkg-deb --build --root-owner-group -Zzstd "$PKG" "$DEB"
          dpkg-deb --info "$DEB"
          dpkg-deb --contents "$DEB" | head -5
          dpkg-deb -f "$DEB" Package Version Architecture Depends
          sha256sum "$DEB"

      - uses: actions/upload-artifact@v4
        with:
          name: piliplus-linux-arm64-deb-fixed
          path: PiliPlus_linux_2.1.6+5472_arm64.deb
          if-no-files-found: error
          retention-days: 7
