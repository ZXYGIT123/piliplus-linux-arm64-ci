name: Build Flutter Engine (linux-arm64 + fontconfig)

# 用官方 flutter/flutter 源码（3.47.7 对应提交）交叉编译带 Fontconfig 的 Linux ARM64 桌面引擎。
# 这是根因修复：官方 3.50 之前的 linux-arm64 桌面引擎没有链接 libfontconfig.so.1，
# 导致系统字体回退失效、中文显示为方框。参数照搬已验证可行的社区方案：
#   gn --target-os linux --linux-cpu arm64 --runtime-mode release --enable-fontconfig --no-prebuilt-dart-sdk
# 产物：libflutter_linux_gtk.so（arm64 aarch64，带 libfontconfig.so.1）

on:
  workflow_dispatch:
    inputs:
      flutter_version:
        description: "Flutter SDK version (for artifact naming)"
        required: false
        default: "3.47.7"
      flutter_commit:
        description: "flutter/flutter commit to build the engine from"
        required: false
        default: "abaf9c523780a608bd46686fd5e53740a07077f8"

env:
  DEPOT_TOOLS_DIR: ${{ github.workspace }}/depot_tools
  ENGINE_DIR: ${{ github.workspace }}/flutter-engine

jobs:
  build-engine:
    name: Flutter engine linux-arm64 (fontconfig)
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          sudo docker image prune --all --force || true
          df -h

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git curl unzip xz-utils zip ca-certificates \
            libglu1-mesa ninja-build clang cmake pkg-config \
            libgtk-3-dev libblkid-dev liblzma-dev libgcrypt20-dev libfontconfig1-dev \
            python3 python3-pip jq
          df -h

      - name: Setup depot_tools
        run: |
          set -eux
          git clone --depth 1 https://chromium.googlesource.com/chromium/tools/depot_tools.git "$DEPOT_TOOLS_DIR"
          echo "$DEPOT_TOOLS_DIR" >> "$GITHUB_PATH"

      - name: Clone Flutter and checkout engine source commit
        run: |
          set -eux
          mkdir -p "$ENGINE_DIR"
          cd "$ENGINE_DIR"
          git clone https://github.com/flutter/flutter.git .
          git checkout "${{ inputs.flutter_commit }}"
          git log -1 --format='%H %s'
          cp engine/scripts/standard.gclient .gclient
          cat .gclient

      - name: gclient sync
        run: |
          set -eux
          cd "$ENGINE_DIR"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=protocol.file.allow
          export GIT_CONFIG_VALUE_0=always
          gclient sync --verbose
          df -h

      - name: Generate build files (fontconfig enabled, linux arm64)
        run: |
          set -eux
          cd "$ENGINE_DIR/engine/src"
          ./flutter/tools/gn \
            --target-os linux \
            --linux-cpu arm64 \
            --runtime-mode release \
            --enable-fontconfig \
            --no-goma \
            --no-prebuilt-dart-sdk
          ls -la out/linux_release_arm64 | head -20

      - name: Build engine
        run: |
          set -eux
          cd "$ENGINE_DIR/engine/src"
          ninja -C out/linux_release_arm64 -j"$(nproc)"

      - name: Verify fontconfig linkage
        run: |
          set -eux
          SO="$ENGINE_DIR/engine/src/out/linux_release_arm64/libflutter_linux_gtk.so"
          file "$SO"
          ls -la "$SO"
          readelf -d "$SO" | grep -i fontconfig
          sha256sum "$SO"
          cp "$SO" "$GITHUB_WORKSPACE/libflutter_linux_gtk.so.arm64-fontconfig"

      - name: Upload engine SO
        uses: actions/upload-artifact@v4
        with:
          name: libflutter_linux_gtk.fontconfig-arm64
          path: ${{ github.workspace }}/libflutter_linux_gtk.so.arm64-fontconfig
          if-no-files-found: error
          retention-days: 7
